name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  grader:
    name: grader, generator, golden worlds (no models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  adapters:
    name: adapter protocol compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile adapters/*.py

  receipts:
    name: every receipt answers a world of its edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'EOF'
          import json, glob, sys
          bad = []
          for edition in ("v1", "v2"):
              digests = {json.load(open(p))["digest"] for p in glob.glob(f"worlds/{edition}/*.json")}
              for p in glob.glob(f"results/{edition}/**/*.json", recursive=True):
                  d = json.load(open(p))
                  found = [s["digest"] for s in d["sizes"]] if "sizes" in d else [d["script_digest"]]
                  bad += [(p, x, edition) for x in found if x not in digests]
          for p, x, edition in bad:
              print(f"{p}: digest {x} is not a {edition} world", file=sys.stderr)
          sys.exit(1 if bad else 0)
          EOF
